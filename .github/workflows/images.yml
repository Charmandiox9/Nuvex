name: Imágenes GHCR
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - id: owner
        run: echo "slug=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.slug }}/nuvex-${{ matrix.target }}:${{ github.ref_name }}
